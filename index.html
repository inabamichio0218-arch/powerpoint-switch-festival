const workTrack=document.getElementById('workSwitchTrack');
const sw=document.getElementById('workSwitch');
// 実寸法でつまみの直径と左右の移動量を設定（パーセント指定による楕円・移動不足を解消）
function sizeSwitch(track){
  const w=track.clientWidth, h=track.clientHeight;
  if(!w||!h)return;
  const pad=Math.max(3,Math.round(h*.055));
  const diameter=Math.max(1,h-2*pad);
  const travel=Math.max(0,w-2*pad-diameter);
  track.style.setProperty('--inset',pad+'px');
  track.style.setProperty('--knob-size',diameter+'px');
  track.style.setProperty('--travel',travel+'px');
}
const resizeObserver=new ResizeObserver(()=>{
  sizeSwitch(heroSwitch);
  sizeSwitch(workTrack);
});
resizeObserver.observe(heroSwitch);
resizeObserver.observe(workTrack);
sizeSwitch(heroSwitch);

// 押してから2秒移動し、到着した時点で表示文字を切り替える。
function moveSwitch(track,on,afterMove){
  const wasOn=track.classList.contains('auto-on');
  if(wasOn===on){track.classList.remove('moving');afterMove?.();return;}
  track.classList.add('moving');
  track.classList.toggle('auto-on',on);
  const knob=track.querySelector('.decor-knob');
  const ended=e=>{
    if(e.target!==knob||e.propertyName!=='transform')return;
    knob.removeEventListener('transitionend',ended);
    track.classList.remove('moving');
    afterMove?.();
  };
  knob.addEventListener('transitionend',ended);
}
let heroOn=false, heroBusy=false;
function cycleHero(){
 if(heroBusy)return;
 heroBusy=true;heroOn=!heroOn;
 moveSwitch(heroSwitch,heroOn,()=>{heroBusy=false;});
}
// 2秒移動 + 1.4秒停止。その後、逆方向へ
setInterval(cycleHero,3400);

const students=[
 {g:1,name:'有留',dir:'aridome_1nen'},{g:1,name:'武田',dir:'takeda_1nen'},{g:1,name:'三浦',dir:'miura_1nen'},
 {g:2,name:'井阪',dir:'isaka_2nen'},
 {g:3,name:'秋月',dir:'akitsuki_3nen'},{g:3,name:'麻',dir:'asa_3nen'},{g:3,name:'小谷',dir:'kotani_3nen'},{g:3,name:'眞保',dir:'sanayasu_3nen'},{g:3,name:'竹元',dir:'takemoto_3nen'},
 {g:4,name:'松浦',dir:'matsuura_4nen'},
 {g:5,name:'田原',dir:'tahara_5nen'},{g:5,name:'山本',dir:'yamamoto_5nen'},
 {g:6,name:'麻',dir:'asa_6nen'},{g:6,name:'石原',dir:'ishihara_6nen'},{g:6,name:'柏木',dir:'kashiwagi_6nen'},{g:6,name:'小関',dir:'koseki_6nen'},{g:6,name:'長田',dir:'nagata_6nen'}
];
const grades=document.getElementById('grades'),menu=document.getElementById('menu'),viewer=document.getElementById('viewer'),offImage=document.getElementById('offImage'),onImage=document.getElementById('onImage');
for(let g=1;g<=6;g++){
  const card=document.createElement('section');card.className='grade-card';
  const h=document.createElement('div');h.className='grade-head';h.textContent=`${g}年生`;card.appendChild(h);
  const names=document.createElement('div');names.className='names';
  for(const s of students.filter(x=>x.g===g)){
    const b=document.createElement('button');b.className='student';b.type='button';b.textContent=s.name;
    b.setAttribute('aria-label',`${g}年生 ${s.name}さんの作品を見る`);
    b.addEventListener('click',()=>openWork(s));
    names.appendChild(b)
  }
  card.appendChild(names);grades.appendChild(card)
}
let isOn=false,workBusy=false;
function setSwitch(value,immediate=false){
  if(workBusy&&!immediate)return;
  isOn=value;
  viewer.classList.toggle('on',isOn);
  sw.setAttribute('aria-label',isOn?'スイッチをOFFにする':'スイッチをONにする');
  if(immediate){
    workBusy=false;
    workTrack.classList.add('no-animation');
    workTrack.classList.remove('moving');
    workTrack.classList.toggle('auto-on',isOn);
    requestAnimationFrame(()=>requestAnimationFrame(()=>workTrack.classList.remove('no-animation')));
  }else{
    workBusy=true;
    moveSwitch(workTrack,isOn,()=>{workBusy=false;});
  }
}
function openWork(s){
  offImage.src=`images/${s.dir}/off.png`;
  onImage.src=`images/${s.dir}/on.png`;
  setSwitch(false,true);
  menu.hidden=true;viewer.hidden=false;viewer.classList.add('active');sizeSwitch(workTrack);
  history.replaceState(null,'','#'+s.dir)
}
function backToMenu(){
  viewer.classList.remove('active');viewer.hidden=true;menu.hidden=false;setSwitch(false,true);
  offImage.removeAttribute('src');onImage.removeAttribute('src');
  history.replaceState(null,'',location.pathname+location.search)
}
sw.addEventListener('click',()=>{if(!workBusy)setSwitch(!isOn)});
document.getElementById('back').addEventListener('click',backToMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!viewer.hidden)backToMenu();else if((e.key===' '||e.key==='Enter')&&!viewer.hidden&&e.target===document.body){e.preventDefault();setSwitch(!isOn)}});
</script></body></html>
